name: Publish report to GitHub Pages
# Publishes reports/uc_report.html every time the report changes on main (or on demand). The page is split by
# scripts/split_site.py: libraries and the 3D and tissue data become files that load only when needed.
on:
  push:
    branches: [main]
    paths: [reports/uc_report.html, scripts/split_site.py, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site folder
        run: |
          python3 scripts/split_site.py reports/uc_report.html site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
