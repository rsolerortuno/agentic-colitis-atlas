name: tests
# Unit tests that need no downloaded data (statistics, verifier rules, graph schema, literature validator). Tests that
# need the cohorts, the graph or the single-cell layer skip themselves when data/processed is empty; run them locally
# after `uv run ucatlas run-all`.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not network"
