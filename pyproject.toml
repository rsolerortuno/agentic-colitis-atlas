[project]
name = "uc-graphrag"
version = "0.1.0"
description = "Agentic multi-omics GraphRAG for ulcerative colitis (public human omics + literature + external knowledge via MCP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "networkx>=3.3",
    "requests>=2.32",
    "pydantic>=2.8",
    "mcp>=1.2,<2",
    "jinja2>=3.1",
    "plotly>=5.24",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "pytest>=8.3",
    "anndata>=0.13.4",
    "h5py>=3.16.0",
    "rdata>=1.1.0",
    "decoupler>=2.3.1",
    "biopython>=1.84",
    "pykvfinder>=0.9.6",
    "openpyxl>=3.1.5",
    "alphagenome==2.0.0",
]

[project.scripts]
ucatlas = "ucatlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: tests that call external APIs (cached on disk after first run)"]
